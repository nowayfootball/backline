[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backline"
version = "0.2.0"
description = "Back-line match reports from broadcast tracking that say how much they could actually see (SkillCorner open data)"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
backline = "backline.__main__:main"

[tool.setuptools]
packages = ["backline"]

[tool.setuptools.package-data]
backline = ["league_reference.csv", "reliability.json", "trust_table.csv"]
